<div class="radio-button">
  <ng-container [ngSwitch]="getState()">
    <button class="play-button play-button_active" (click)="onPause()" *ngSwitchCase="stateType.Playing">
      <svg-icon class="play-button__icon" src="assets/pause-circle.svg"></svg-icon>
    </button>
    <button class="play-button play-button_active" (click)="onResume()" *ngSwitchCase="stateType.Paused">
      <svg-icon class="play-button__icon" src="assets/play-circle.svg"></svg-icon>
    </button>
    <button class="play-button" (click)="onPlay()" *ngSwitchDefault>
      <svg-icon class="play-button__icon" src="assets/play-circle.svg"></svg-icon>
    </button>
  </ng-container>
  <div class="radio-button__title">{{ 'Radio' | locale }}</div>
</div>
<div class="radio-info"><b>{{tracksCount}}</b> tracks, duration <b>{{getDuration()}}</b></div>
